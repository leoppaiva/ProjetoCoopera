<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medidor Coopera</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <main>
  <header>
      <p class="org">Coopera Luz</p>
      <h1>Medidor Coopera</h1>
      <p>Cadastre aparelhos da sua casa e veja o consumo real, seu valor estimado e quantos painéis solares você precisaria para suprir esse gasto.</p>
  </header>

    
  <section>
    <h2>Adicionar aparelho</h2>
      <form id="form-aparelho">
        <label class="nome">Nome <input id="nome" name="nome" type="text" required></label>

        <label>Potência (W) <input id="potenciaW" name="potenciaW" type="number" step="any" required></label>
        
        <label>Horas por dia <input id="horasDia" name="horasDia" type="number" step="any" required></label>
        
        <label>Dias no mês <input id="diasMes" name="diasMes" type="number" step="any" required></label>
        
        <button type="submit">Adicionar</button>
      
      </form>
    </section>

    
    <section>
    <h2>Seus aparelhos</h2>
      <ul id="lista-aparelhos"></ul>
      
      <div class="acoes">
      
        <button id="btn-simular" type="button" class="primario">Simular</button>
      
        <p id="erro" class="erro" role="alert" hidden></p>
    </div>
    
  </section>

    <section id="resultado" hidden></section>
  
  </main>
  
  <script src="app.js"></script>

</body>

</html>
